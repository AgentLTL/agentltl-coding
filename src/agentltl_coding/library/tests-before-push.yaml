summary: Run the tests, and see them pass, after your last edit before pushing (pytest, npm/cargo/go/make test, tox, jest).
tags: [testing, git]
rules:
  - id: tests-before-push
    before:
      first:
        - {tool: [pytest, tox, nox, jest, vitest], succeeded: true}
        - {tool: [npm, pnpm, yarn, cargo, go, make, just], with: {argv: test}, succeeded: true}
        - {tool: [uv, poetry], with: {argv: pytest}, succeeded: true}
        - {tool: npx, with: {argv: jest}, succeeded: true}
      then: git_push
      since: [Edit, Write, MultiEdit, NotebookEdit]
    why: Untested pushes break CI for everyone.
    fix: Run the test suite after your last edit and make it pass, then push. If your project tests differently, replace this rule with your own command.
