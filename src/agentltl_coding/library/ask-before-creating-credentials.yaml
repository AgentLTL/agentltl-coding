summary: Ask before minting new credentials (access keys, service-account keys, tokens, service principals).
tags: [secrets, devops]
rules:
  - id: ask-before-creating-credentials
    never: [aws_iam_create_access_key, aws_iam_create_login_profile, aws_sts_get_session_token,
            aws_sts_assume_role, gcloud_iam_service_accounts_keys_create, az_ad_sp_create_for_rbac,
            az_ad_sp_credential_reset, vault_token_create, gh_auth_refresh]
    why: New credentials are printed once and stay valid; the user should know they exist and decide where they go.
    mode: ask
