summary: Never put a secret value on the command line (passwords in flags, bearer headers, credentials in URLs).
tags: [secrets, devops]
rules:
  - id: no-secrets-in-commands
    never:
      - {tool: curl, where: {header: ["*uthorization: Bearer *", "*uthorization: Basic *", "*-Token: *", "*-Key: *"]}}
      - {tool: curl, where: {user: "*:*"}}
      - {tool: "*", where: {"*": ["*://*:*@*"]}}
      - {tool: mysql, where: {password_suffix: "?*"}}
      - {tool: redis_cli, where: {password: "?*"}}
      - {tool: docker_login, where: {password: "?*"}}
      - {tool: kubectl_create, where: {from_literal: "*=*"}}
      - {tool: [aws_secretsmanager_create_secret, aws_secretsmanager_put_secret_value], where: {secret_string: "?*"}}
      - {tool: aws_ssm_put_parameter, with: {type: SecureString}}
      - {tool: [az_keyvault_secret_set], where: {value: "?*"}}
      - {tool: [gh_secret_set], where: {body: "?*"}}
      - {tool: [az_login, az_acr_login, kubectl_config_set_credentials], where: {password: "?*"}}
      - {tool: kubectl_config_set_credentials, where: {token: "?*"}}
    why: Command lines end up in the conversation, the shell history and process listings.
    fix: Read the secret from a file or an environment variable the tool supports (--password-stdin, --from-file, -F secret=@file), or let the user run the command.
    mode: block
