summary: Mistral Vibe never signs commits, tags or notes (no Co-Authored-By, no "Generated by Mistral Vibe").
harnesses: [mistral-vibe]
tags: [git]
rules:
  - id: no-vibe-coauthor
    never: [git_commit, git_commit_tree, git_tag, git_notes, git_merge, git_revert, git_cherry_pick]
    where:
      "*": ["*[Cc]o-[Aa]uthored-[Bb]y*", "*vibe@mistral.ai*", "*[Gg]enerated by*[Vv]ibe*",
            "*[Mm]istral [Vv]ibe <*", "user.name=*[Vv]ibe*", "user.email=*mistral.ai*"]
    why: Mistral Vibe should not appear in git history.
    fix: Drop the Co-Authored-By / "Generated by Mistral Vibe" lines and commit as the user.
