summary: Ask before skipping git hooks (--no-verify, which also skips secret scanners) or force-adding ignored files.
tags: [secrets, git, devops]
rules:
  - id: no-skipping-secret-scans
    never:
      - {tool: [git_commit, git_push], with: {no_verify: true}}
      - {tool: git_add, with: {force: true}}
    why: Pre-commit hooks often run secret scanners, and ignored files often are the secrets.
    mode: ask
