summary: Never read, copy, send or edit credential files (.env, keys, cloud and tool credentials, shell history).
tags: [secrets, devops]
rules:
  - id: protect-secret-files
    never:
      tool: "*"
      where:
        "*":
          # project files
          - ".env"
          - ".env.local"
          - ".env.*.local"
          - ".env.production"
          - ".env.staging"
          - ".env.development"
          - ".envrc"
          - "*.tfvars"
          - "terraform.tfstate*"
          - "*.pem"
          - "*.key"
          - "*.p12"
          - "*.pfx"
          - "*.jks"
          - "credentials.json"
          - "service-account*.json"
          - "**/secrets.yaml"
          - "**/secrets.yml"
          - ".htpasswd"
          # home directory
          - "**/.ssh/id_*"
          - "**/.gnupg/*"
          - "**/.aws/credentials"
          - "**/.config/gcloud/*"
          - "**/.azure/*"
          - "**/.kube/config"
          - "**/.docker/config.json"
          - "**/.npmrc"
          - "**/.pypirc"
          - "**/.netrc"
          - "**/.git-credentials"
          - "**/.config/gh/hosts.yml"
          - "**/.vault-token"
          - "**/.pgpass"
          - "**/.my.cnf"
          - "**/.claude/.credentials.json"
          - "**/.bash_history"
          - "**/.zsh_history"
          # system
          - "/etc/shadow"
          - "/proc/*/environ"
    why: These files hold credentials. Reading one puts the secret into the conversation and the transcript; copying or sending one leaks it.
    fix: Ask the user for what you need (a variable name, a non-secret value), or use the example file (.env.example).
    mode: stop
