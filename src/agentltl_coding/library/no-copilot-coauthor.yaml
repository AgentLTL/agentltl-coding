summary: Copilot never signs commits, tags or notes (no Co-authored-by, no Copilot author).
harnesses: [copilot-cli]
tags: [git]
rules:
  - id: no-copilot-coauthor
    never: [git_commit, git_commit_tree, git_tag, git_notes, git_merge, git_revert, git_cherry_pick]
    where:
      "*": ["*[Cc]o-[Aa]uthored-[Bb]y*", "*Copilot@users.noreply.github.com*",
            "*[Gg]enerated *[Cc]opilot*", "*[Cc]opilot <*", "user.name=*[Cc]opilot*"]
    why: Copilot should not appear in git history.
    fix: Drop the Co-authored-by / "Generated by Copilot" lines and commit as the user.
