summary: Ask before commands that print secrets from a store (kubectl secrets, vault, cloud secret managers, password managers, sops...).
tags: [secrets, devops]
rules:
  - id: ask-before-reading-secret-stores
    never:
      - {tool: kubectl_get, where: {resource: ["secret", "secrets", "secret/*", "secrets/*"]}}
      - {tool: kubectl_config_view, with: {raw: true}}
      - [helm_get_values, helm_get_all]
      - [terraform_output, terraform_show, terraform_state_pull, terraform_console]
      - [aws_secretsmanager_get_secret_value, aws_secretsmanager_batch_get_secret_value,
         aws_configure_get, aws_configure_export_credentials, aws_ecr_get_login_password, aws_kms_decrypt]
      - {tool: [aws_ssm_get_parameter, aws_ssm_get_parameters, aws_ssm_get_parameters_by_path],
         with: {with_decryption: true}}
      - [gcloud_secrets_versions_access, gcloud_auth_print_access_token, gcloud_auth_print_identity_token,
         gcloud_auth_application_default_print_access_token]
      - [az_keyvault_secret_show, az_keyvault_secret_download, az_keyvault_key_download,
         az_account_get_access_token, az_storage_account_keys_list,
         az_storage_account_show_connection_string, az_acr_credential_show]
      - [vault_kv_get, vault_read, vault_print_token, vault_token_lookup]
      - [gh_auth_token]
      - {tool: gh_auth_status, with: {show_token: true}}
      - {tool: git_credential, with: {action: fill}}
      - [heroku_config, heroku_config_get, heroku_auth_token, doppler_secrets, doppler_secrets_get,
         doppler_secrets_download, vercel_env_pull]
      - {tool: sops, with: {decrypt: true}}
      - [ansible_vault_view, ansible_vault_decrypt]
      - {tool: [gpg, age], with: {decrypt: true}}
      - {tool: gpg, with: {export_secret_keys: true}}
      - [op_read, op_item_get, bw_get, bw_export, pass_show, secret_tool_lookup,
         security_find_generic_password, security_find_internet_password, security_dump_keychain]
      - {tool: [openssl_rsa, openssl_pkey, openssl_ec], with: {text: true}}
      - {tool: openssl_pkcs12, with: {nodes: true}}
    why: These commands print secret values, which then sit in the conversation and the transcript.
    fix: If the value is only needed by another command, pass it without printing it (a pipe, or an environment variable set by the tool), or ask the user.
    mode: ask
