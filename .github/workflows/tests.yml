name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "agentltl @ git+https://github.com/AgentLTL/AgentLTL.git" \
                      "cli-to-tools @ git+https://github.com/AgentLTL/cli-to-tools.git" pytest
          pip install -e . --no-deps
      - name: Test
        run: pytest -q
