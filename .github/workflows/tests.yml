name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "agentltl @ git+https://github.com/AgentLTL/AgentLTL.git" \
                      "cli-to-tools @ git+https://github.com/AgentLTL/cli-to-tools.git" pytest
          pip install -e . --no-deps
      - name: Test
        run: pytest -q
