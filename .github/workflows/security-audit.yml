# Weekly: look the package's dependencies up in the Python advisory database (pip-audit).
# A known vulnerability fails the run, and GitHub emails the repository's admins about it.
name: Security audit

on:
  schedule:
    - cron: "29 6 * * 1"
  pull_request:
    paths: [pyproject.toml, .github/workflows/security-audit.yml]
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install .
          pip-audit
